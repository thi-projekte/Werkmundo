name: Auftraggeber service tests

on:
  pull_request:
  push:
    branches:
      - main
      - SquadAuftraggeber
      - 'Jan/squad-integration-pruefung'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-tests:
    name: '${{ matrix.service }} / PostgreSQL'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [offer-service, invoice-service]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: service_test
          POSTGRES_USER: service_test
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U service_test -d service_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: 'backend/services/${{ matrix.service }}'
    env:
      OFFER_PERSISTENCE: postgres
      OFFER_DB_ENABLED: 'true'
      OFFER_DB_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/service_test
      OFFER_DB_USER: service_test
      OFFER_DB_PASSWORD: ci-test-only
      DOCUMENT_DB_TESTS: 'true'
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/service_test
      QUARKUS_DATASOURCE_USERNAME: service_test
      QUARKUS_DATASOURCE_PASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test against PostgreSQL
        run: sh ./mvnw -B '-Dquarkus.http.test-port=18082' clean verify
      - name: Verify test reports and required PostgreSQL suites
        env:
          TESTED_SERVICE: ${{ matrix.service }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path('target/surefire-reports').glob('TEST-*.xml'))
          if not reports:
              raise SystemExit('No test reports found')

          suites = [ET.parse(path).getroot() for path in reports]

          for suite in suites:
              for attribute in ('failures', 'errors', 'skipped'):
                  if int(suite.get(attribute, '0')) > 0:
                      raise SystemExit(
                          f"{suite.get('name')}: {attribute} > 0"
                      )

          required = {
              'offer-service': [
                  'OfferJpaRepositoryIntegrationTest',
              ],
              'invoice-service': [
                  'PostgresDocumentRepositoryTest',
                  'PostgresInvoiceRepositoryTest',
                  'InvoiceIdempotencyTest',
              ],
          }[os.environ['TESTED_SERVICE']]

          for name in required:
              if not any(
                  suite.get('name', '').endswith('.' + name)
                  and int(suite.get('tests', '0')) > 0
                  for suite in suites
              ):
                  raise SystemExit(f'Missing database test suite: {name}')

          total = sum(int(suite.get('tests', '0')) for suite in suites)
          print(f'{total} tests passed; required PostgreSQL suites executed.')
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: |
            backend/services/${{ matrix.service }}/target/surefire-reports/
            backend/services/${{ matrix.service }}/target/failsafe-reports/
          if-no-files-found: warn
