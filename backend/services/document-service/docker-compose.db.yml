name: werkmundo-document-test

services:
  document-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: document_db
      POSTGRES_USER: document_user
      POSTGRES_PASSWORD: ${DOCUMENT_DB_PASSWORD:?Document database password required}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - document_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_user -d document_db"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  document_pgdata:
