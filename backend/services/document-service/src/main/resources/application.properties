quarkus.application.name=document-service
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.active=${document.storage.postgres.enabled:false}
quarkus.flyway.active=${document.storage.postgres.enabled:false}
quarkus.flyway.migrate-at-start=${document.storage.postgres.enabled:false}

# Production needs its own configured PostgreSQL database and a Keycloak realm.
%prod.document.storage.postgres.enabled=true
quarkus.keycloak.devservices.enabled=false
quarkus.oidc.application-type=service
quarkus.oidc.token.principal-claim=sub
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:document-service}
%dev.quarkus.http.host=127.0.0.1
%dev.quarkus.oidc.enabled=false
%dev.quarkus.http.auth.basic=true
%dev.quarkus.security.users.embedded.enabled=true
%dev.quarkus.security.users.embedded.plain-text=true
%dev.quarkus.security.users.embedded.users.document-dev=document-dev-password
%dev.quarkus.security.users.embedded.roles.document-dev=document-user
%test.quarkus.oidc.tenant-enabled=false

%dev.document.mail.from=${DOCUMENT_MAIL_FROM:noreply@localhost}
%test.document.mail.from=${DOCUMENT_MAIL_FROM:noreply@localhost}
%prod.document.mail.from=${DOCUMENT_MAIL_FROM}
%dev.quarkus.mailer.mock=true
%test.quarkus.mailer.mock=true
%prod.quarkus.mailer.host=${SMTP_HOST}
%prod.quarkus.mailer.port=${SMTP_PORT:587}
%prod.quarkus.mailer.username=${SMTP_USERNAME:}
%prod.quarkus.mailer.password=${SMTP_PASSWORD:}
%prod.quarkus.mailer.start-tls=REQUIRED
