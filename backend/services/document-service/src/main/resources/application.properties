quarkus.application.name=document-service
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.active=${document.storage.postgres.enabled:false}
quarkus.flyway.active=${document.storage.postgres.enabled:false}
quarkus.flyway.migrate-at-start=${document.storage.postgres.enabled:false}

# Production needs its own configured PostgreSQL database and a Keycloak realm.
%prod.document.storage.postgres.enabled=true
quarkus.keycloak.devservices.enabled=false
quarkus.oidc.application-type=service
quarkus.oidc.token.principal-claim=sub
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:document-service}
%dev.quarkus.oidc.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL}
%dev.quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:document-service}
%test.quarkus.oidc.tenant-enabled=false
