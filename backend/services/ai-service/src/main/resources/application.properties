# =====================================================================================
# ai-service (Squad Handwerker)
#
# Zustandsloser KI-Service hinter POST /ai/process. Wird von der Process Engine per
# HTTP-Connector aufgerufen und meldet das Ergebnis als Message "ergebnisKI" zurueck.
# Eigene Datenbank: keine (Entscheidung fuer diesen Sprint, siehe docs/OFFENE-PUNKTE.md).
#
# Alle Werte sind per Env-Variable ueberschreibbar (Vorlage: .env.example).
# Die Defaults sind fuer den LOKALEN Betrieb gedacht:
#   - kein Login/Token noetig
#   - Mock-Katalog statt catalog-service
#   - ohne MEGALLM_API_KEY liefert der Service ein Stub-Ergebnis (Wallbox-Beispiel)
#
# Secrets (MEGALLM_API_KEY, AI_SERVICE_OIDC_SECRET) NIE in diese Datei oder ins Git schreiben.
# =====================================================================================

# ---------- HTTP ----------
# 8086: kollidiert nicht mit dem lokalen Setup (8081-8085 Services, 8090 Keycloak).
quarkus.http.port=${HTTP_PORT:8086}
quarkus.http.test-port=0

# Keine Dev Services (sonst startet Quarkus im Dev-/Test-Modus z.B. einen eigenen Keycloak).
quarkus.devservices.enabled=false

# ---------- Zugriffsschutz fuer /ai/* (eingehend) ----------
# Lokal: offen (AI_AUTH_POLICY=permit, AI_SECURITY_ENABLED=false).
# Online: AI_SECURITY_ENABLED=true und AI_AUTH_POLICY=process-engine -> nur Aufrufe mit
# Keycloak-Token, das die Rolle AI_REQUIRED_ROLE (Default process-engine) traegt.
quarkus.oidc.tenant-enabled=${AI_SECURITY_ENABLED:false}
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8090}/realms/${KEYCLOAK_REALM:handwerker-realm}
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=${AI_ROLE_CLAIM_PATH:realm_access/roles}
quarkus.http.auth.permission.ai.paths=/ai/*
quarkus.http.auth.permission.ai.policy=${AI_AUTH_POLICY:permit}
quarkus.http.auth.policy.process-engine.roles-allowed=${AI_REQUIRED_ROLE:process-engine}
# /ai/transcribe wird direkt vom Frontend aufgerufen (nicht von der Process Engine) und hat
# deshalb eine eigene Regel (spezifischerer Pfad gewinnt gegenueber /ai/*).
# Lokal: permit. Online: AI_TRANSCRIBE_AUTH_POLICY=authenticated (Token des Handwerkers).
quarkus.http.auth.permission.transcribe.paths=/ai/transcribe
quarkus.http.auth.permission.transcribe.policy=${AI_TRANSCRIBE_AUTH_POLICY:permit}

# ---------- CORS (Frontend ruft /ai/transcribe direkt aus dem Browser auf) ----------
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${AI_CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept

# Sprachaufnahmen von einigen Minuten (webm/opus) bleiben deutlich unter 25 MB.
quarkus.http.limits.max-body-size=${AI_MAX_UPLOAD_SIZE:25M}

# ---------- Speech-to-Text (Deepgram) ----------
# Ohne DEEPGRAM_API_KEY liefert /ai/transcribe ein Beispiel-Transkript (Stub, nur lokal sinnvoll).
deepgram.api.key=${DEEPGRAM_API_KEY:}
deepgram.api.url=${DEEPGRAM_API_URL:https://api.deepgram.com/v1/listen}
deepgram.model=${DEEPGRAM_MODEL:nova-2}
deepgram.language=${DEEPGRAM_LANGUAGE:de}

# ---------- Technisches Token fuer ausgehende Aufrufe (Process Engine, catalog-service) ----------
# Lokal aus. Online: AI_TECHNICAL_TOKEN_ENABLED=true + AI_SERVICE_OIDC_SECRET setzen
# (Keycloak-Client "ai-service", Grant client_credentials).
ai.technical-token.enabled=${AI_TECHNICAL_TOKEN_ENABLED:false}
quarkus.oidc-client.client-enabled=${AI_TECHNICAL_TOKEN_ENABLED:false}
quarkus.oidc-client.auth-server-url=${KEYCLOAK_URL:http://localhost:8090}/realms/${KEYCLOAK_REALM:handwerker-realm}
quarkus.oidc-client.discovery-enabled=false
quarkus.oidc-client.token-path=/protocol/openid-connect/token
quarkus.oidc-client.client-id=${AI_SERVICE_OIDC_CLIENT_ID:ai-service}
quarkus.oidc-client.credentials.secret=${AI_SERVICE_OIDC_SECRET:}
quarkus.oidc-client.grant.type=client
quarkus.oidc-client.early-tokens-acquisition=false

# ---------- Process Engine (CIB seven / Camunda 7 REST) ----------
# Muss auf /engine-rest enden. Lokal laeuft die Process Engine auf Port 8085.
quarkus.rest-client."camunda-engine".url=${CAMUNDA_ENGINE_URL:http://localhost:8085/engine-rest}
quarkus.rest-client."camunda-engine".connect-timeout=5000
quarkus.rest-client."camunda-engine".read-timeout=10000
# HTTP 400 = Prozess wartet noch nicht auf ergebnisKI -> so oft erneut versuchen.
ai.processengine.correlation.max-attempts=${CAMUNDA_CORRELATION_MAX_ATTEMPTS:5}
ai.processengine.correlation.wait-ms=${CAMUNDA_CORRELATION_WAIT_MS:1000}

# ---------- MegaLLM (LLM-Provider, OpenAI-kompatibel) ----------
# Ohne MEGALLM_API_KEY: Call 1 liefert den Stub, Call 2 nimmt den Top-Kandidaten der Suche.
quarkus.rest-client."megallm".url=${MEGALLM_API_URL:https://ai.megallm.io/v1}
quarkus.rest-client."megallm".connect-timeout=5000
quarkus.rest-client."megallm".read-timeout=90000
megallm.api.key=${MEGALLM_API_KEY:}
# Modellwahl-Evaluation (docs/referenz/ai-service-modellwahl.md): gemini-3-flash-preview,
# Fallback aus anderer Modellfamilie (greift z.B. bei 503 "Resource overloaded").
megallm.model.default=${MEGALLM_MODEL:gemini-3-flash-preview}
megallm.model.fallback=${MEGALLM_MODEL_FALLBACK:google-gemma-4-26b}

# ---------- Katalogsuche (LLM-Call 2) ----------
# true  = gebuendelter Mock-Katalog (src/main/resources/mock/catalog-mock.json) - Default lokal
# false = echter catalog-service (lokal Port 8083)
catalog.mock.enabled=${CATALOG_MOCK_ENABLED:true}
quarkus.rest-client."catalog-search".url=${CATALOG_SERVICE_URL:http://localhost:8083}
quarkus.rest-client."catalog-search".connect-timeout=5000
quarkus.rest-client."catalog-search".read-timeout=10000

# ---------- Logging ----------
quarkus.log.category."de.winfprojekt.werkmundo.aiservice".level=${AI_LOG_LEVEL:INFO}
