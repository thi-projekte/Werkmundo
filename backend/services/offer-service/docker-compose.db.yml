
name: werkmundo-issue32

services:
  offer-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: offer_db
      POSTGRES_USER: offer_user
      POSTGRES_PASSWORD: ${OFFER_DB_PASSWORD:?Password required}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - offer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offer_user -d offer_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  offer_pgdata:
