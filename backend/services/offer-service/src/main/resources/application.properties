quarkus.application.name=offer-service
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

# Default to Arne's in-memory repository; opt in to PostgreSQL using OFFER_PERSISTENCE=postgres.
offer.persistence=${OFFER_PERSISTENCE:memory}

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${OFFER_DB_JDBC_URL:jdbc:postgresql://localhost:55432/offer_db}
quarkus.datasource.username=${OFFER_DB_USER:offer_user}
quarkus.datasource.password=${OFFER_DB_PASSWORD:}
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.datasource.devservices.enabled=false

# Production validates the same Keycloak subject used by the other services.
quarkus.keycloak.devservices.enabled=false
quarkus.oidc.application-type=service
quarkus.oidc.token.principal-claim=sub
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:offer-service}
%test.quarkus.oidc.tenant-enabled=false
%dev.quarkus.oidc.tenant-enabled=false

# Avoid a DB dependency for in-memory dev/test setups. For local DB testing set OFFER_DB_ENABLED=true.
%dev.quarkus.hibernate-orm.active=${OFFER_DB_ENABLED:false}
%test.quarkus.hibernate-orm.active=${OFFER_DB_ENABLED:false}
%dev.quarkus.flyway.migrate-at-start=${OFFER_DB_ENABLED:false}
%test.quarkus.flyway.migrate-at-start=${OFFER_DB_ENABLED:false}

# Local-only Basic Auth for manual API testing. Never enable this realm in prod.
%dev.quarkus.http.host=127.0.0.1
%dev.quarkus.http.auth.basic=true
%dev.quarkus.security.users.embedded.enabled=true
%dev.quarkus.security.users.embedded.plain-text=true
%dev.quarkus.security.users.embedded.users.offer-dev=${OFFER_DEV_PASSWORD}

# Production never uses the in-memory repository.
%prod.offer.persistence=postgres
%prod.quarkus.datasource.jdbc.url=${OFFER_DB_JDBC_URL}
%prod.quarkus.datasource.username=${OFFER_DB_USER}
%prod.quarkus.datasource.password=${OFFER_DB_PASSWORD}
%prod.quarkus.hibernate-orm.active=true
%prod.quarkus.flyway.migrate-at-start=true

# Anbindung der bestehenden User-, Katalog- und Prozessfunktionen
quarkus.rest-client.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
quarkus.rest-client."de.winfprojekt.craftvoice.offerservice.user.UserServiceClient".url=${USER_SERVICE_URL:http://localhost:8081}
quarkus.rest-client."de.winfprojekt.craftvoice.offerservice.catalog.CatalogServiceClient".url=${CATALOG_SERVICE_URL:http://localhost:8083}
process-engine.url=${PE_URL:http://localhost:8085/engine-rest}
quarkus.rest-client."de.winfprojekt.craftvoice.offerservice.processengine.ProcessEngineRestClient".url=${process-engine.url}
deepgram.api-key=${DEEPGRAM_API_KEY:changeme}

# Rollen und bestehender öffentlicher Kundenlink
quarkus.oidc.roles.role-claim-path=resource_access/frontend/roles
quarkus.http.auth.permission.public-annahme.paths=/angebote/annahme/*
quarkus.http.auth.permission.public-annahme.policy=permit

# Lokales Frontend
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept

# Einheitliche Spaltennamen entsprechend den Flyway-Migrationen
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
