quarkus.application.name=catalog-service
quarkus.http.port=${HTTP_PORT:8083}
quarkus.http.limits.max-body-size=10M
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true
quarkus.keycloak.devservices.enabled=false
quarkus.oidc.application-type=service
quarkus.oidc.token.principal-claim=sub
quarkus.oidc.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL}
quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:catalog}
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.datasource.active=${CATALOG_TEST_DATABASE:false}
%test.quarkus.flyway.active=${CATALOG_TEST_DATABASE:false}
