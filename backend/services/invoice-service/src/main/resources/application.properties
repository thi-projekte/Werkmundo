quarkus.application.name=invoice-service
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.active=${document.storage.postgres.enabled:false}
quarkus.flyway.active=${document.storage.postgres.enabled:false}
quarkus.flyway.migrate-at-start=${document.storage.postgres.enabled:false}

# Production needs its own configured PostgreSQL database and a Keycloak realm.
%prod.document.storage.postgres.enabled=true
quarkus.keycloak.devservices.enabled=false
quarkus.oidc.application-type=service
quarkus.oidc.token.principal-claim=sub
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:invoice-service}
%dev.quarkus.oidc.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL}
%dev.quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:invoice-service}
%test.quarkus.oidc.tenant-enabled=false

# Ausgehende Verbindung zum Offer-Service
quarkus.rest-client.offer-service.url=${OFFER_SERVICE_URL:http://localhost:8082}
quarkus.rest-client.offer-service.connect-timeout=5000
quarkus.rest-client.offer-service.read-timeout=10000

# Ausgehende Verbindung zum User-Service
quarkus.rest-client.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
quarkus.rest-client.user-service.connect-timeout=5000
quarkus.rest-client.user-service.read-timeout=10000

# Rollen aus dem gemeinsamen Keycloak-Realm
quarkus.oidc.roles.role-claim-path=realm_access/roles