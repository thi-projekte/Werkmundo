# --- PRODUCTION CONFIG (For Docker/Server) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}

quarkus.hibernate-orm.database.generation=update
quarkus.http.port=8080

# Keycloak OIDC. Bearer tokens are validated locally via JWKS.
# The confidential client secret is not required and must not be sent to the shared realm.
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${KEYCLOAK_URL}/realms/${userservice.keycloak.realm}
quarkus.oidc.client-id=user-service

# Keycloak Admin Client
quarkus.keycloak.admin-client.server-url=${KEYCLOAK_URL}
userservice.keycloak.realm=${KEYCLOAK_USER_REALM:handwerker-realm}
userservice.profile-picture.storage-path=${DOCUMENT_STORAGE_PATH:${java.io.tmpdir}/craftvoice}
userservice.profile-picture.max-size-bytes=${PROFILE_PICTURE_MAX_SIZE_BYTES:5242880}
quarkus.keycloak.admin-client.realm=master
quarkus.keycloak.admin-client.username=${KEYCLOAK_ADMIN_USER}
quarkus.keycloak.admin-client.password=${KEYCLOAK_ADMIN_PASSWORD}
quarkus.keycloak.admin-client.grant-type=password

quarkus.mailer.mock=true
quarkus.log.level=INFO

# CORS for frontend and craftvoice domains (required for browser requests)
# ACHTUNG: user-service laeuft auf Quarkus 3.15.1 -> hier heisst der Schalter noch
# "quarkus.http.cors" (NICHT ".enabled"; das kam erst in neueren Versionen, siehe catalog-service 3.36).
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,https://cv.winfprojekt.de,https://craftvoice.winfprojekt.de
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept

# --- TEST OVERRIDES (Only active during 'mvn test' in CI) ---
# This fixes the "UnknownHostException: postgres" error
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# Disable Security for CI tests to avoid connection errors to Keycloak
%test.quarkus.oidc.enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.keycloak.admin-client.server-url=http://localhost:8081
%test.quarkus.oidc.credentials.secret=${USER_SERVICE_OIDC_SECRET:}
# These test-profile placeholders satisfy client configuration validation; tests do not contact Keycloak.
%test.quarkus.keycloak.admin-client.username=test-only-user
%test.quarkus.keycloak.admin-client.password=test-only-password
