# --- PRODUCTION CONFIG (For Docker/Server) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:user-db}

quarkus.hibernate-orm.database.generation=update

# Lokale Entwicklung
%dev.quarkus.http.port=8091

# Lokaler Keycloak
%dev.quarkus.oidc.auth-server-url=http://localhost:8181/realms/handwerker-realm
%dev.quarkus.keycloak.admin-client.server-url=http://localhost:8181

# Lokale PostgreSQL-Datenbank
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/user-db
%dev.quarkus.datasource.username=postgres
%dev.quarkus.datasource.password=${LOCAL_DB_PASSWORD:local-dev-password}

#Standardkonfiguration
quarkus.http.port=8080

# Keycloak OIDC
quarkus.oidc.client-id=${OIDC_CLIENT_ID:user-service}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}

# Keycloak Admin Client
quarkus.keycloak.admin-client.server-url=${KEYCLOAK_URL:http://localhost:8080}
quarkus.keycloak.admin-client.realm=${KEYCLOAK_ADMIN_REALM:master}
quarkus.keycloak.admin-client.username=${KEYCLOAK_ADMIN_USER}
quarkus.keycloak.admin-client.password=${KEYCLOAK_ADMIN_PASSWORD}
quarkus.keycloak.admin-client.grant-type=password

quarkus.mailer.mock=true
quarkus.log.level=INFO

# CORS for frontend and craftvoice domains (required for browser requests)
# ACHTUNG: user-service laeuft auf Quarkus 3.15.1 -> hier heisst der Schalter noch
# "quarkus.http.cors" (NICHT ".enabled"; das kam erst in neueren Versionen, siehe catalog-service 3.36).
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,https://cv.winfprojekt.de,https://craftvoice.winfprojekt.de
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept

# --- TEST OVERRIDES (Only active during 'mvn test' in CI) ---
# This fixes the "UnknownHostException: postgres" error
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.database.generation=drop-and-create

# Disable Security for CI tests to avoid connection errors to Keycloak
%test.quarkus.oidc.enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.keycloak.admin-client.server-url=http://localhost:8081

# Keycloak Admin Client im Testprofil
%test.quarkus.keycloak.admin-client.username=test-admin
%test.quarkus.keycloak.admin-client.password=test-password
%test.quarkus.keycloak.admin-client.grant-type=password

%test.quarkus.http.test-port=0
app.registration.send-verification-email=true
%dev.app.registration.send-verification-email=false