# Nginx im Frontend-Container (Produktion).
# Liefert die React-App aus und leitet API-Aufrufe intern an die Services weiter.
# Dadurch läuft alles unter einer Domain: kein CORS, ein Zertifikat, ein Proxy Host im NPM.
#
#   /svc/user/...      -> werkmundo-user:8080/...
#   /svc/offer/...     -> werkmundo-offer:8080/...
#   /svc/document/...  -> werkmundo-document:8080/...

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Profilbilder, Audioaufnahmen und PDFs
  client_max_body_size 25m;

  # Docker-DNS; Namen werden pro Anfrage aufgelöst, damit Nginx auch startet,
  # wenn ein Service noch nicht läuft (sonst bricht der Container beim Start ab).
  resolver 127.0.0.11 valid=10s ipv6=off;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_read_timeout 120s;

  location /svc/user/ {
    set $upstream werkmundo-user:8080;
    rewrite ^/svc/user/(.*)$ /$1 break;
    proxy_pass http://$upstream;
  }

  location /svc/offer/ {
    set $upstream werkmundo-offer:8080;
    rewrite ^/svc/offer/(.*)$ /$1 break;
    proxy_pass http://$upstream;
  }

  location /svc/document/ {
    set $upstream werkmundo-document:8080;
    rewrite ^/svc/document/(.*)$ /$1 break;
    proxy_pass http://$upstream;
  }

  # Gebaute Assets haben Hashes im Namen und dürfen lange gecacht werden
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA-Routing: unbekannte Pfade liefern index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
