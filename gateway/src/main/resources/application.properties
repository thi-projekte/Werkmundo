quarkus.application.name=api-gateway
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8087}

quarkus.keycloak.devservices.enabled=false

# Keycloak-Adresse wird beim Start gesetzt.
quarkus.oidc.tenant-enabled=true
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${GATEWAY_OIDC_AUTH_SERVER_URL}
quarkus.oidc.roles.role-claim-path=realm_access/roles

gateway.user.host=${GATEWAY_USER_HOST:localhost}
gateway.user.port=${GATEWAY_USER_PORT:8081}

# User-Aufrufe benötigen standardmäßig einen gültigen Token.
quarkus.http.auth.permission.user-protected.paths=/svc/user/*
quarkus.http.auth.permission.user-protected.policy=authenticated

# Registrierung und Passwort-Zurücksetzung funktionieren ohne Login.
quarkus.http.auth.permission.user-public.paths=/svc/user/api/users/register,/svc/user/api/users/password-reset/initiate
quarkus.http.auth.permission.user-public.methods=POST
quarkus.http.auth.permission.user-public.policy=permit

gateway.offer.host=${GATEWAY_OFFER_HOST:localhost}
gateway.offer.port=${GATEWAY_OFFER_PORT:8082}

# Standard: Angebotsaufrufe benötigen einen gültigen Login-Token.
quarkus.http.auth.permission.offer-protected.paths=/svc/offer/*
quarkus.http.auth.permission.offer-protected.policy=authenticated

# Bestehender Kundenlink mit Angebotstoken im Pfad.
quarkus.http.auth.permission.offer-public-link.paths=/svc/offer/angebote/annahme/*
quarkus.http.auth.permission.offer-public-link.methods=GET,POST
quarkus.http.auth.permission.offer-public-link.policy=permit

# Kundenansicht: Der Offer-Service prüft X-Offer-Access-Token.
quarkus.http.auth.permission.offer-customer-read.paths=/svc/offer/api/offers/*/customer
quarkus.http.auth.permission.offer-customer-read.methods=GET
quarkus.http.auth.permission.offer-customer-read.policy=permit

# Kundenentscheidungen mit demselben Angebotstoken.
quarkus.http.auth.permission.offer-customer-action.paths=/svc/offer/api/offers/*/customer/accept,/svc/offer/api/offers/*/customer/reject,/svc/offer/api/offers/*/customer/changes
quarkus.http.auth.permission.offer-customer-action.methods=POST
quarkus.http.auth.permission.offer-customer-action.policy=permit

gateway.invoice.host=${GATEWAY_INVOICE_HOST:localhost}
gateway.invoice.port=${GATEWAY_INVOICE_PORT:8084}

quarkus.http.auth.permission.invoice-protected.paths=/svc/invoice/*
quarkus.http.auth.permission.invoice-protected.policy=authenticated

gateway.catalog.host=${GATEWAY_CATALOG_HOST:localhost}
gateway.catalog.port=${GATEWAY_CATALOG_PORT:8083}

quarkus.http.auth.permission.catalog-protected.paths=/svc/catalog/*
quarkus.http.auth.permission.catalog-protected.policy=authenticated